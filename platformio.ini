; Hoymiles HIT → Consolinno SunSpec Proxy
; Default: LILYGO T-Connect-Pro (ESP32-S3 + W5500 Eth + Display)
; Optional env: t-poe-pro (ESP32 + LAN8720 PoE)
; Optional env: wt32-eth01 (ESP32 + LAN8720, 4 MB Flash, ohne Display)

[platformio]
default_envs = t-connect-pro

[env]
platform = espressif32 @ 53.3.13
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  emelianov/modbus-esp8266 @ ^4.1.0
  ESP32Async/ESPAsyncWebServer @ ^3.6.0
  ESP32Async/AsyncTCP @ ^3.3.2
  knolleary/PubSubClient @ ^2.8
build_flags =
  -I include
  -DCORE_DEBUG_LEVEL=1
  -DPROXY_VERSION=\"0.5.7\"
build_src_filter = +<*>

[env:t-connect-pro]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_T_CONNECT_PRO=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.0

[env:t-poe-pro]
board = esp32dev
; Standard-Tabelle hat nur 1,25 MB pro App, die Firmware ist größer (OTA bleibt mit 2x 1,9 MB)
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DBOARD_T_POE_PRO=1
  -DETH_PHY_TYPE=ETH_PHY_LAN8720
  -DETH_PHY_ADDR=0
  -DETH_PHY_MDC=23
  -DETH_PHY_MDIO=18
  -DETH_PHY_POWER=12
  -DETH_CLK_MODE=ETH_CLOCK_GPIO0_IN

[env:wt32-eth01]
; WT32-ETH01: ESP32 ohne PSRAM, 4 MB Flash, LAN8720 mit 50-MHz-Oszillator an GPIO0 (Enable an GPIO16)
; RS485 optional über externen Wandler mit automatischer Richtungsumschaltung an IO17 (TX) / IO5 (RX)
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DBOARD_WT32_ETH01=1
  -DETH_PHY_TYPE=ETH_PHY_LAN8720
  -DETH_PHY_ADDR=1
  -DETH_PHY_MDC=23
  -DETH_PHY_MDIO=18
  -DETH_PHY_POWER=16
  -DETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
  -DPIN_RS485_TX=17
  -DPIN_RS485_RX=5
