; Hoymiles HIT → Consolinno SunSpec Proxy
; Default: LILYGO T-Connect-Pro (ESP32-S3 + W5500 Eth + Display)
; Optional env: t-poe-pro (ESP32 + LAN8720 PoE)
; Optional env: wt32-eth01 (ESP32 + LAN8720, 4 MB Flash, ohne Display)
; Optional env: p4-poe-eth (Waveshare ESP32-P4-WIFI6-POE-ETH, IP101 + PoE, WLAN ueber ESP32-C6)

[platformio]
default_envs = t-connect-pro

[env]
platform = espressif32 @ 53.3.13
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  emelianov/modbus-esp8266 @ ^4.1.0
  ESP32Async/ESPAsyncWebServer @ ^3.6.0
  ESP32Async/AsyncTCP @ ^3.3.2
  knolleary/PubSubClient @ ^2.8
build_flags =
  -I include
  -DCORE_DEBUG_LEVEL=1
  -DPROXY_VERSION=\"0.7.0\"
build_src_filter = +<*>

[env:t-connect-pro]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_T_CONNECT_PRO=1
  ; Bluetooth-LED-Strip: nur hier, auf dem ESP32 (T-POE-Pro, WT32) reichen IRAM/DRAM bzw. Flash nicht
  -DHAS_BLE_LED=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.0

[env:t-poe-pro]
; LILYGO T-POE-Pro: ESP32-WROVER-E, 16 MB Flash, 8 MB PSRAM, LAN8720 (PoE), RS485 on board
; Pins laut LilyGO-T-ETH-Series (examples/UnitTestExample/utilities.h, LILYGO_T_ETH_POE_PRO):
; der ESP gibt den 50-MHz-Takt an GPIO0 aus, PHY-Reset an GPIO5, RS485 TX 32 / RX 33
board = esp32dev
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_T_POE_PRO=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DETH_PHY_TYPE=ETH_PHY_LAN8720
  -DETH_PHY_ADDR=0
  -DETH_PHY_MDC=23
  -DETH_PHY_MDIO=18
  -DETH_PHY_POWER=5
  -DETH_CLK_MODE=ETH_CLOCK_GPIO0_OUT
  -DPIN_RS485_TX=32
  -DPIN_RS485_RX=33

[env:wt32-eth01]
; WT32-ETH01: ESP32 ohne PSRAM, 4 MB Flash, LAN8720 mit 50-MHz-Oszillator an GPIO0 (Enable an GPIO16)
; RS485 optional über externen Wandler mit automatischer Richtungsumschaltung an IO17 (TX) / IO5 (RX)
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DBOARD_WT32_ETH01=1
  -DETH_PHY_TYPE=ETH_PHY_LAN8720
  -DETH_PHY_ADDR=1
  -DETH_PHY_MDC=23
  -DETH_PHY_MDIO=18
  -DETH_PHY_POWER=16
  -DETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
  -DPIN_RS485_TX=17
  -DPIN_RS485_RX=5

[env:p4-poe-eth]
; Waveshare ESP32-P4-WIFI6-POE-ETH: ESP32-P4, 32 MB PSRAM, 32 MB Flash (genutzt 16 MB), PoE on board.
; Ethernet IP101GRI per RMII: MDC 31, MDIO 52, PHY-Reset 51, Adresse 1, 50-MHz-Takt von der PHY an GPIO50;
; die RMII-Datenpins sind die P4-Vorgaben des Arduino-Kerns (TX_EN 49, TXD 34/35, RXD 29/30, CRS_DV 28).
; WLAN kommt vom ESP32-C6 auf der Platine (ESP-Hosted ueber SDIO).
; RS485 optional ueber externen Wandler mit automatischer Richtungsumschaltung an GPIO4 (TX) / GPIO5 (RX).
board = esp32-p4
board_upload.flash_size = 16MB
board_upload.maximum_size = 4128768
board_build.partitions = partitions_16MB.csv
build_flags =
  ${env.build_flags}
  -DBOARD_P4_POE_ETH=1
  -DETH_PHY_TYPE=ETH_PHY_TLK110
  -DETH_PHY_ADDR=1
  -DETH_PHY_MDC=31
  -DETH_PHY_MDIO=52
  -DETH_PHY_POWER=51
  -DETH_CLK_MODE=EMAC_CLK_EXT_IN
  -DPIN_RS485_TX=4
  -DPIN_RS485_RX=5
